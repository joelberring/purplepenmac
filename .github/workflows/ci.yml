name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: src
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Avalonia application
        run: dotnet restore AvPurplePen/AvPurplePen.csproj

      - name: Restore PDF converter
        run: dotnet restore PdfConverter/PdfConverter.csproj

      - name: Restore view-model tests
        run: dotnet restore PurplePenViewModels.Tests/PurplePenViewModels.Tests.csproj

      - name: Restore PDF production tests
        run: dotnet restore MapModel/Map_PDF.Tests/Map_PDF.Tests.csproj

      # Build output is echoed as annotations so failures are readable from the
      # checks API even when raw logs are not accessible.
      - name: Build Avalonia application
        run: |
          set -o pipefail
          dotnet build AvPurplePen/AvPurplePen.csproj --configuration Debug --no-restore --verbosity minimal -m:1 2>&1 | tee build.log || {
            grep -E "error|Error" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Test view models
        run: |
          set -o pipefail
          dotnet test PurplePenViewModels.Tests/PurplePenViewModels.Tests.csproj --configuration Debug --no-restore --verbosity minimal 2>&1 | tee test.log || {
            grep -E "error|Failed|Assert|Expected|But was|at " test.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build PDF production tests
        run: |
          set -o pipefail
          dotnet build MapModel/Map_PDF.Tests/Map_PDF.Tests.csproj --configuration Debug --no-restore --verbosity minimal -m:1 2>&1 | tee build-pdf.log || {
            grep -E "error|Error" build-pdf.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Verify PDF overprint output
        run: |
          set -o pipefail
          dotnet vstest MapModel/Map_PDF.Tests/bin/Debug/net10.0/Map_PDF.Tests.dll --TestCaseFilter:"FullyQualifiedName~PdfProductionTests" --logger:"console;verbosity=normal" 2>&1 | tee vstest.log || {
            grep -E "error|Failed|Assert|Expected|But was" vstest.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
