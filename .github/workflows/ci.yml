name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    permissions:
      contents: write   # only used to publish sample print PDFs to the ci-print-output branch

    defaults:
      run:
        working-directory: src
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Avalonia application
        run: dotnet restore AvPurplePen/AvPurplePen.csproj -p:DisableGitVersionTask=true

      - name: Restore PDF converter
        run: dotnet restore PdfConverter/PdfConverter.csproj -p:DisableGitVersionTask=true

      - name: Restore view-model tests
        run: dotnet restore PurplePenViewModels.Tests/PurplePenViewModels.Tests.csproj -p:DisableGitVersionTask=true

      - name: Restore PDF production tests
        run: dotnet restore MapModel/Map_PDF.Tests/Map_PDF.Tests.csproj -p:DisableGitVersionTask=true

      - name: Restore print production tests
        run: dotnet restore PurplePenCore.PrintTests/PurplePenCore.PrintTests.csproj -p:DisableGitVersionTask=true

      # Build output is echoed as annotations so failures are readable from the
      # checks API even when raw logs are not accessible.
      - name: Build Avalonia application
        run: |
          set -o pipefail
          dotnet build AvPurplePen/AvPurplePen.csproj --configuration Debug --no-restore --verbosity minimal -m:1 -p:DisableGitVersionTask=true 2>&1 | tee build.log || {
            grep -E "error|Error" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Test view models
        run: |
          set -o pipefail
          dotnet test PurplePenViewModels.Tests/PurplePenViewModels.Tests.csproj --configuration Debug --no-restore --verbosity minimal -p:DisableGitVersionTask=true 2>&1 | tee test.log || {
            grep -E "error|Failed|Assert|Expected|But was|at " test.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build PDF production tests
        run: |
          set -o pipefail
          dotnet build MapModel/Map_PDF.Tests/Map_PDF.Tests.csproj --configuration Debug --no-restore --verbosity minimal -m:1 -p:DisableGitVersionTask=true 2>&1 | tee build-pdf.log || {
            grep -E "error|Error" build-pdf.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Verify PDF overprint output
        run: |
          set -o pipefail
          dotnet vstest MapModel/Map_PDF.Tests/bin/Debug/net10.0/Map_PDF.Tests.dll --TestCaseFilter:"FullyQualifiedName~PdfProductionTests" --logger:"console;verbosity=normal" 2>&1 | tee vstest.log || {
            grep -E "error|Failed|Assert|Expected|But was" vstest.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Print production tests (course PDFs with BL profiles)
        env:
          PP_PRINT_TEST_OUTPUT: ${{ runner.temp }}/print-output
        run: |
          set -o pipefail
          dotnet test PurplePenCore.PrintTests/PurplePenCore.PrintTests.csproj --configuration Debug --no-restore --verbosity minimal -p:DisableGitVersionTask=true --logger:"console;verbosity=detailed" 2>&1 | tee printtest.log || {
            grep -E -A2 "error|Failed|Assert|Expected|But was|Message:|Exception|colour operators|  colour " printtest.log | grep -v "^--" | head -150 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          grep -E "Lower purple lies|Using map colour|colour operators|  colour " printtest.log | head -60 | while IFS= read -r line; do echo "::notice::$line"; done

      - name: Publish sample print PDFs
        if: always() && matrix.os == 'macos-latest' && github.event_name == 'push'
        env:
          OUT: ${{ runner.temp }}/print-output
        run: |
          if [ ! -d "$OUT" ] || [ -z "$(ls -A "$OUT")" ]; then echo "No sample PDFs"; exit 0; fi
          cd "$OUT"
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-print-output
          echo "Sample course PDFs from ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.txt
          git add -A
          git commit -q -m "Sample print PDFs for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-print-output
