name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Avalonia application
        run: dotnet restore AvPurplePen/AvPurplePen.csproj

      - name: Restore PDF converter
        run: dotnet restore PdfConverter/PdfConverter.csproj

      - name: Restore view-model tests
        run: dotnet restore PurplePenViewModels.Tests/PurplePenViewModels.Tests.csproj

      - name: Restore PDF production tests
        run: dotnet restore MapModel/Map_PDF.Tests/Map_PDF.Tests.csproj

      - name: Build Avalonia application
        run: dotnet build AvPurplePen/AvPurplePen.csproj --configuration Debug --no-restore --verbosity minimal -m:1

      - name: Test view models
        run: dotnet test PurplePenViewModels.Tests/PurplePenViewModels.Tests.csproj --configuration Debug --no-restore --verbosity minimal

      - name: Build PDF production tests
        run: dotnet build MapModel/Map_PDF.Tests/Map_PDF.Tests.csproj --configuration Debug --no-restore --verbosity minimal -m:1

      - name: Verify PDF overprint output
        run: dotnet vstest MapModel/Map_PDF.Tests/bin/Debug/net10.0/Map_PDF.Tests.dll --TestCaseFilter:"FullyQualifiedName~PdfProductionTests" --logger:"console;verbosity=normal"
